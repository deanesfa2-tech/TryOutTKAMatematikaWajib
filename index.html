<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">

<title>Try Out TKA Matematika 2025</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#eef2ff;--bg2:#fdf2f8;--card:#fff;--tx:#1e1b4b;--mu:#6b7280;--pr:#6d28d9;--pr2:#0ea5e9;--ok:#16a34a;--rg:#f59e0b;--no:#cbd5e1;--bd:#e5e7eb;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1e1b4b;--bg2:#0f172a;--card:#1f2347;--tx:#eef2ff;--mu:#a5b4fc;--no:#475569;--bd:#3b4170}}
:root[data-theme="dark"]{--bg1:#1e1b4b;--bg2:#0f172a;--card:#1f2347;--tx:#eef2ff;--mu:#a5b4fc;--no:#475569;--bd:#3b4170}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh}
.w{max-width:1040px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 6px 24px #6d28d926;border:1px solid var(--bd)}
.hero{background:linear-gradient(120deg,var(--pr),var(--pr2));color:#fff;border-radius:18px;padding:22px;margin-bottom:16px}
.hero h1{margin:0 0 4px;font-size:1.5rem}.hero p{margin:0;opacity:.9}
label{display:block;font-weight:600;margin:12px 0 4px}
input{width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--bd);background:transparent;color:var(--tx);font-size:1rem}
input:focus{outline:2px solid var(--pr);border-color:transparent}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 18px;font-weight:600;color:#fff;background:var(--pr)}
button.g{background:var(--pr2)}button.y{background:var(--rg)}button.s{background:var(--ok)}button.o{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}
button:disabled{opacity:.4;cursor:not-allowed}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tm{background:#111827;color:#fde68a;border-radius:12px;padding:8px 14px;font-weight:700;font-variant-numeric:tabular-nums}.tm.l{background:var(--bad);color:#fff}
.g2{display:grid;grid-template-columns:1fr 280px;gap:16px}@media(max-width:760px){.g2{grid-template-columns:1fr}}
.q{white-space:pre-line;line-height:1.6;font-size:1.02rem;margin:8px 0 14px}
.tag{display:inline-block;background:#ede9fe;color:var(--pr);padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700}
.op{display:flex;gap:10px;align-items:center;padding:12px;margin:8px 0;border:1.5px solid var(--bd);border-radius:12px;cursor:pointer}
.op:hover{border-color:var(--pr)}.op.on{background:#ede9fe;border-color:var(--pr);color:#3b0764}
.op.ok{background:#dcfce7;border-color:var(--ok);color:#14532d}.op.bad{background:#fee2e2;border-color:var(--bad);color:#7f1d1d}
.nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.n{padding:9px 0;border-radius:10px;text-align:center;font-weight:700;background:var(--no);color:#fff;cursor:pointer;border:2px solid transparent}
.n.a{background:var(--ok)}.n.r{background:var(--rg)}.n.c{border-color:var(--pr);box-shadow:0 0 0 3px #6d28d94d}
.lg{font-size:.8rem;color:var(--mu);margin-top:12px;display:grid;gap:4px}.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:middle}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left}th:not(:first-child),td:not(:first-child){text-align:center;width:70px}
.sc{font-size:4rem;font-weight:800;line-height:1}
.ex{background:#f0f9ff;color:#0c4a6e;border-left:4px solid var(--pr2);padding:10px 12px;border-radius:8px;white-space:pre-line;margin-top:8px;line-height:1.5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .op.on{color:#ede9fe;background:#4c1d95}}
.rv{border-top:1px solid var(--bd);padding:14px 0}.st{font-weight:700}
.ct{border:10px double #b8860b;background:#fffdf5;color:#1e1b4b;padding:26px;text-align:center;border-radius:6px;--tx:#1e1b4b;--mu:#6b7280;--bd:#e5e7eb;--no:#cbd5e1}
@media print{.np{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style></head><body><div class="w" id="app"></div>
<script>
const Q=[
{t:"pg",q:"Diberikan A = {x | x < 6, x ∈ bilangan asli}, B = {x | x bilangan genap, x ∈ bilangan cacah}, C = {x | x ≤ 10, x ∈ bilangan prima}.\nHasil dari (A ∩ B) ∪ C adalah ....",o:["{2, 3, 5, 7}","{0, 2, 3, 5, 7}","{2, 3, 4, 5, 7}","{0, 2, 3, 4, 5, 7}","{2, 3, 4, 5, 7, 10}"],a:2,e:"A = {1,2,3,4,5}; B = {0,2,4,6,...}; A ∩ B = {2,4}.\nC = {2,3,5,7}.\n(A ∩ B) ∪ C = {2,3,4,5,7}."},
{t:"pg",q:"Bentuk sederhana dari (3^(2/3) × 8^(3/2)) / (2^(5/2) × 9^(5/6)) adalah ....",o:["1/42","2/3","4/3","6","12"],a:2,e:"8^(3/2) = 2^(9/2) dan 9^(5/6) = 3^(5/3).\nBilangan 2: 2^(9/2 − 5/2) = 2² = 4.\nBilangan 3: 3^(2/3 − 5/3) = 3^(−1) = 1/3.\nHasil = 4/3."},
{t:"kt",q:"Operasi biner ⊙ didefinisikan a ⊙ b = ((a − b)² + 2ab) / (a + b) untuk setiap bilangan real tidak negatif a dan b.\nJika a ⊙ 2 = 5, tentukan Benar atau Salah!",o:["a merupakan kelipatan 3.","a merupakan bilangan prima.","a ⊙ 0 = 6."],a:[true,false,true],e:"((a−2)² + 4a)/(a+2) = 5 → a² + 4 = 5a + 10 → a² − 5a − 6 = 0 → a = 6 atau a = −1. Karena a ≥ 0, a = 6.\n• 6 kelipatan 3 → Benar.\n• 6 bukan prima → Salah.\n• a ⊙ 0 = a²/a = a = 6 → Benar."},
{t:"pg",q:"Peneliti memodelkan peningkatan suhu akibat pemanasan global dengan y = 0,02x − 39,9; x = tahun, y = peningkatan suhu (°C).\nPada tahun berapakah peningkatan suhu diperkirakan mencapai 0,7 °C?",o:["Tahun 2000","Tahun 2003","Tahun 2025","Tahun 2030","Tahun 2345"],a:3,e:"0,7 = 0,02x − 39,9 → 0,02x = 40,6 → x = 2030."},
{t:"pg",q:"Tempat Les Pintarku memberi potongan kepada 50 pendaftar pertama: y = 0,9x (x biaya awal, y biaya setelah potongan).\nTambahan potongan sesuai nilai rapor: g(y) = 0,7y jika nilai di atas 90; g(y) = 0,8y jika nilai 85–90.\nFira (pendaftar ke-50) membayar Rp180.000. Datang empat siswa lain:\nAndi (rapor 90, uang Rp285.000), Budi (92, Rp286.000), Cici (89, Rp280.000), Dini (95, Rp287.000).\nDengan uang yang dimiliki, siapakah yang pasti dapat mengikuti kursus?",o:["Dini.","Dini dan Budi.","Dini, Budi dan Andi.","Dini, Cici, Budi dan Andi.","Cici dan Andi."],a:3,e:"Fira: 0,9x = 180.000 → x = Rp200.000 (biaya awal).\nPara siswa baru bukan 50 pendaftar pertama, jadi biaya paling mahal Rp200.000 (tanpa diskon rapor).\nUang terkecil Rp280.000 > Rp200.000, sehingga keempatnya pasti mampu."},
{t:"pg",q:"Pada pertandingan Indonesia vs Jepang, pendukung membentuk koreo. Kertas di baris kursi paling bawah 400 lembar, baris kedua 550 lembar, dan seterusnya bertambah dengan pola yang sama.\nJika pola berlaku sampai baris ketujuh, berapa penonton yang memegang kertas di baris ke-5?",o:["700 orang.","850 orang.","1.000 orang.","1.150 orang.","1.300 orang."],a:2,e:"Barisan aritmetika: a = 400, b = 550 − 400 = 150.\nU5 = 400 + 4 × 150 = 1.000."},
{t:"mc",q:"Kadar asam urat pasien hari pertama 13 mg/dL. Obat menurunkan kadar 20% setiap hari secara konsisten.\n• Pasien nyaman jika kadar di bawah 7 mg/dL.\n• Dianggap sembuh jika kadar kurang dari 5 mg/dL.\nPada hari keberapa pasien merasa nyaman namun belum dianggap sembuh? (Pilih semua yang benar)",o:["Hari ke-2","Hari ke-3","Hari ke-4","Hari ke-5","Hari ke-6"],a:[2,3],e:"Barisan geometri: a = 13, r = 0,8.\nH2 = 10,4; H3 = 8,32; H4 = 6,656; H5 = 5,32; H6 = 4,26.\nNyaman (< 7) tapi belum sembuh (≥ 5): hari ke-4 dan ke-5."},
{t:"pg",q:"[Gambar] Daerah segitiga yang diarsir memiliki titik sudut A(−4, 0), B(0, 2), dan C(2, 0). Garis AB (f) dan garis BC (g) adalah batas daerahnya.\nDaerah yang diarsir merupakan himpunan penyelesaian dari sistem pertidaksamaan ....",o:["x − 2y ≥ −4; x + y ≤ 2; x ≥ 0; y ≥ 0","x − 2y ≥ −4; x + y ≥ 2; y ≥ 0","2x − y ≤ 4; x + y ≤ 2; y ≥ 0","x − 2y ≥ −4; x + y ≤ 2; y ≥ 0","2x − y ≥ 4; x + y ≤ 2; x ≥ 0; y ≥ 0"],a:3,e:"Garis AB: melalui (−4,0) dan (0,2) → x − 2y = −4. Uji (0,0): 0 ≥ −4 → x − 2y ≥ −4.\nGaris BC: x + y = 2. Uji (0,0): 0 ≤ 2 → x + y ≤ 2.\nDaerah di atas sumbu X → y ≥ 0. Daerah meluas ke x negatif, sehingga tidak ada syarat x ≥ 0."},
{t:"pg",q:"Bu Silma menyusun buket dari bunga mawar (m), lili (l), dan anyelir (a). Harga buket: Tipe A Rp85.000, Tipe B Rp70.000, Tipe C Rp75.000.\n[Komposisi dari gambar] A = 2 mawar + 3 lili + 3 anyelir; B = 2 mawar + 2 lili + 2 anyelir; C = 3 mawar + 1 lili + 1 anyelir.\nPembeli membeli buket tipe C dan menambah 2 tangkai lili dan 1 tangkai anyelir (harga satuan). Total yang harus dibayar adalah ....",o:["Rp75.000","Rp102.000","Rp110.000","Rp115.000","Rp116.000"],a:1,e:"Dari ketiga buket diperoleh harga satuan: mawar Rp20.000, lili Rp12.000, anyelir Rp3.000 (cek: B = 20+12+3 = 35 per set ×2 = 70; C = 60+12+3 = 75; A = 40+36+9 = 85).\nTotal = 75.000 + 2(12.000) + 3.000 = Rp102.000.\nCatatan: komposisi bunga dibaca dari gambar soal asli; periksa kembali dengan PDF."},
{t:"mc",q:"[Gambar] Dua garis mendatar sejajar (garis tengah dan alas segitiga) dipotong oleh sisi miring AC. Di titik potong garis tengah dengan AC terbentuk sudut F (kiri-atas), E (kanan-atas), B (kiri-bawah), D (kanan-bawah). C adalah sudut di alas, A sudut di puncak.\nPasangan sudut manakah yang membentuk 180°? (Pilih semua yang benar)",o:["∠A dan ∠B","∠A dan ∠E","∠B dan ∠C","∠B dan ∠D","∠E dan ∠C"],a:[2,3,4],e:"∠F = ∠C (sehadap, garis sejajar). ∠B berpelurus dengan ∠F, ∠E berpelurus dengan ∠F, ∠B dan ∠D berpelurus.\n• B + C = (180° − F) + F = 180° ✔\n• B + D = 180° (berpelurus) ✔\n• E + C = (180° − F) + F = 180° ✔\n∠A tidak berhubungan dengan 180° (∠A + ∠C = 90°)."},
{t:"mc",q:"Zara ingin menaruh papan jadwal pada dinding yang TIDAK sejajar dengan dinding rak buku gantung. Rak buku gantung berada pada dinding belakang-kanan CDHG (kubus ABCD alas, EFGH atas).\nPada dinding manakah papan jadwal akan diletakkan? (Pilih semua yang benar)",o:["CDHG","BCGF","ABFE","BCFA","ADHE"],a:[0,1,4],e:"Dinding yang sejajar CDHG adalah ABFE, sehingga tidak boleh dipakai.\nDinding yang boleh: CDHG (dinding itu sendiri), BCGF, dan ADHE (tegak lurus CDHG). BCFA bukan sebuah dinding."},
{t:"pg",q:"[Gambar] Trapesium KLMN dan NMPO sebangun. KL = 32 cm, KN = 16 cm, OP = 18 cm; KL ∥ NM ∥ OP dan sudut di K siku-siku.\nBerapakah panjang sisi LM?",o:["6√5 cm","8√5 cm","9√5 cm","10√5 cm","14√5 cm"],a:1,e:"Kesebangunan KLMN ~ NMPO: KL/NM = NM/OP → 32/NM = NM/18 → NM² = 576 → NM = 24.\nSelisih sejajar = 32 − 24 = 8, tinggi KN = 16.\nLM = √(8² + 16²) = √320 = 8√5 cm."},
{t:"kt",q:"[Gambar] Kebun berbentuk trapesium siku-siku: sisi kiri 500 cm, sisi kanan 350 cm, alas 360 cm. Pot diletakkan sepanjang sisi miring. Diameter pot: jahe 15 cm, kunyit 26 cm, lengkuas 30 cm.\nTentukan benar atau salah!",o:["Ada 25 tanaman jahe yang bisa ditanam.","Ada 15 tanaman kunyit yang bisa ditanam.","Ada 10 tanaman lengkuas yang bisa ditanam."],a:[false,true,false],e:"Sisi miring = √(360² + (500 − 350)²) = √(129.600 + 22.500) = √152.100 = 390 cm.\n• Jahe: 390 ÷ 15 = 26 pot (bukan 25) → Salah.\n• Kunyit: 390 ÷ 26 = 15 pot → Benar.\n• Lengkuas: 390 ÷ 30 = 13 pot (bukan 10) → Salah."},
{t:"pg",q:"Titik B' = (−4, 1) adalah bayangan titik B hasil refleksi terhadap garis y = 1, kemudian rotasi 180° dengan pusat O(0,0).\nTitik B yang sesuai adalah ....",o:["B(4, −1)","B(4, 3)","B(−6, −1)","B(−2, −1)","B(2, 4)"],a:1,e:"Balik urutan: urungkan rotasi 180° → (−x, −y): (−4, 1) → (4, −1).\nUrungkan refleksi terhadap y = 1: (x, 2 − y) → (4, 2 − (−1)) = (4, 3).\nJadi B(4, 3)."},
{t:"pg",q:"[Gambar] Tali hiasan dipasang di langit-langit dari pojok dinding pintu ke bagian tengah langit-langit dinding papan tulis. Ruangan tinggi 5 m; jarak horizontal sepanjang dinding papan tulis ke titik tengah = 3 m (setengah dari 6 m) dan jarak tegak lurus ke dinding itu = 4 m.\nTali kedua yang sama dipasang ke pojok lain. Jika membeli gulungan tali 20 m, berapa sisa tali yang tidak terpakai?",o:["6 m","10 m","11 m","13 m","14 m"],a:1,e:"Panjang satu tali = √(3² + 4²) = 5 m (segitiga siku-siku 3-4-5 pada bidang langit-langit).\nDua tali = 10 m. Sisa = 20 − 10 = 10 m."},
{t:"pg",q:"[Gambar] Ornamen jam dinding berupa gabungan segitiga sama kaki (alas 50 cm) dan lingkaran berdiameter 20 cm; tinggi total 70 cm. Setengah bagian bawah lingkaran menonjol di bawah alas segitiga.\nKayu tipis ditempel mengelilingi ornamen. Jika Arif membuat dua ornamen (π = 3,14), berapa panjang kayu tipis yang diperlukan?",o:["322,8 cm","352,8 cm","362,8 cm","382,8 cm","445,6 cm"],a:3,e:"Tinggi segitiga = 70 − 10 = 60 cm. Sisi miring = √(25² + 60²) = 65 cm.\nSisa alas = 50 − 20 = 30 cm. Setengah keliling lingkaran = ½ × 3,14 × 20 = 31,4 cm.\nKeliling satu ornamen = 2(65) + 30 + 31,4 = 191,4 cm.\nDua ornamen = 382,8 cm."},
{t:"pg",q:"Panjang salah satu diagonal suatu layang-layang adalah 20 cm. Berapakah kelilingnya?\n(1) Luas layang-layang adalah 160 cm².\n(2) Panjang salah satu sisi layang-layang adalah 10 cm.\nPutuskan apakah pernyataan (1) dan (2) cukup untuk menjawab!",o:["Pernyataan (1) SAJA cukup, (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup, (1) SAJA tidak cukup.","DUA pernyataan BERSAMA-SAMA cukup, tetapi SATU pernyataan SAJA tidak cukup.","Pernyataan (1) SAJA cukup dan (2) SAJA cukup.","Pernyataan (1) dan (2) tidak cukup."],a:2,e:"(1) Luas = ½ d₁d₂ = 160 → diagonal lain 16 cm, tetapi letak perpotongan diagonal belum diketahui → sisi-sisi belum pasti.\n(2) Hanya satu sisi 10 cm → belum cukup.\nBersama: panjang sisi 10 dan setengah diagonal 8 menentukan bagian diagonal (6), sisanya (14), sehingga kedua pasang sisi dan keliling dapat dihitung → cukup."},
{t:"pg",q:"Pak Omar mengirim helm dalam kardus berukuran 20 cm × 20 cm × 30 cm (tinggi kardus 20 cm, posisi atas tidak boleh dibalik) menggunakan truk dengan bak panjang 240 cm, lebar 150 cm, tinggi 120 cm. Kardus boleh dihadapkan ke depan atau ke samping (diputar 90°).\nBerapa paling banyak kardus yang dapat dimuat?",o:["336 kardus","360 kardus","384 kardus","432 kardus","504 kardus"],a:1,e:"Tinggi 120 ÷ 20 = 6 lapis.\nAlas kardus 20 × 30: pada lantai 240 × 150, susun sisi 30 sepanjang lebar 150 (5 kardus) dan sisi 20 sepanjang panjang 240 (12 kardus) → 5 × 12 = 60 kardus/lapis, tanpa sisa.\nTotal = 60 × 6 = 360 kardus."},
{t:"pg",q:"Bu Sita membuat 8 hiasan lampu tidur berbentuk tabung berongga (tanpa alas dan tutup), diameter 14 cm, tinggi 25 cm. Bagian luar dilapisi stiker vinil. Satu lembar stiker (Rp9.000) menutupi 300 cm².\nBerapa biaya minimal membeli stiker untuk 8 hiasan?",o:["Rp72.000","Rp108.000","Rp252.000","Rp270.000","Rp288.000"],a:3,e:"Luas selimut satu tabung = π × d × t = 22/7 × 14 × 25 = 1.100 cm².\nDelapan hiasan = 8.800 cm².\n8.800 ÷ 300 = 29,3 → dibulatkan ke atas 30 lembar.\nBiaya = 30 × Rp9.000 = Rp270.000."},
{t:"kt",q:"[Gambar] Segitiga ABC dengan AD ⊥ BC, AB = 4 cm, DC = AB = 4 cm. Sudut α di A pada segitiga ADC, β di B.\nJika cos α = 3/5, tentukan Benar atau Salah!",o:["sin(β) = √7/4","cos(β) = √7/5","tan(β) = 3√7/7"],a:[false,false,true],e:"Segitiga ADC: cos α = AD/AC = 3/5, DC = 4 → AC = 5, AD = 3.\nSegitiga ABD: AB = 4, AD = 3 → BD = √(16 − 9) = √7.\n• sin β = AD/AB = 3/4 → pernyataan Salah.\n• cos β = BD/AB = √7/4 → pernyataan Salah.\n• tan β = AD/BD = 3/√7 = 3√7/7 → Benar."},
{t:"mc",q:"[Diagram garis] Banyak lulusan (2017 → 2025):\nSMA 1 Bintang: 301, 310, 310, 301, 308, 310, 315, 350, 360\nSMA 2 Bintang: 255, 260, 290, 310, 315, 320, 300, 300, 300\nSMK Kejora: 250, 285, 301, 320, 320, 325, 320, 350, 400\nPernyataan mana yang tepat? (Pilih semua yang benar)",o:["Banyak siswa SMA 1 Bintang yang lulus selalu bertambah mulai tahun 2020.","Pada 2017–2020, banyak lulusan ketiga sekolah selalu bertambah.","Banyak lulusan SMK Kejora konsisten naik selama lima tahun terakhir.","Banyak lulusan SMA 2 Bintang tetap sama selama tiga tahun terakhir.","Banyak lulusan ketiga sekolah di tahun 2023 menurun dibanding tahun sebelumnya."],a:[0,3],e:"1) SMA 1 sejak 2020: 301 → 308 → 310 → 315 → 350 → 360, selalu naik → Benar.\n2) SMA 1: 2018 ke 2019 tetap 310 dan 2020 turun → Salah.\n3) SMK Kejora 2022 ke 2023 turun (325 → 320) → Salah.\n4) SMA 2 tahun 2023–2025 tetap 300 → Benar.\n5) SMA 1 pada 2023 naik (310 → 315) → Salah."},
{t:"pg",q:"Pada bazar sekolah terdapat 5 stan yang dikelola pedagang berbeda. Stan pedagang C ingin berada di antara pedagang A dan pedagang D.\nBanyak kemungkinan susunan stan sesuai keinginan pedagang C adalah ....",o:["6 susunan","12 susunan","120 susunan","240 susunan","720 susunan"],a:1,e:"A, C, D harus berurutan dengan C di tengah: ACD atau DCA → 2 cara.\nAnggap ACD sebagai 1 blok; bersama 2 pedagang lain ada 3 unsur → 3! = 6 cara.\nTotal = 2 × 6 = 12 susunan."},
{t:"kt",q:"Jumlah pengunjung perpustakaan minggu ke-1 Januari: Senin 4, Selasa p, Rabu 5, Kamis r, Jumat 6.\nDiketahui: (1) rata-rata 6 orang; (2) setiap hari minimal dua dan tidak pernah melebihi 10 pengunjung; (3) median 6.\nTentukan Benar atau Salah!",o:["Banyak pengunjung hari Selasa pasti selalu lebih banyak dibandingkan hari lain.","Banyak pengunjung hari Kamis pasti lebih dari 5 orang.","Banyak pengunjung hari Jumat dan Kamis mungkin saja sama."],a:[false,true,true],e:"Rata-rata 6 → jumlah 30 → p + r = 30 − 15 = 15.\nMedian 6 mengharuskan p, r ≥ 6 (jika salah satu ≤ 5, maka yang lain 10 dan median menjadi 5). Dengan p, r ≤ 10, maka 6 ≤ p, r ≤ 9.\n• Selasa belum tentu terbanyak (mis. p = 7, r = 8) → Salah.\n• r ≥ 6 > 5 → Benar.\n• r = 6, p = 9 mungkin → Benar."},
{t:"pg",q:"Kotak undian berisi 60 angpao: 15 kupon Rp25.000, 12 kupon Rp50.000, 10 set sendok-garpu, 8 pemanas air, dan sisanya kosong. Rini mengambil satu angpao secara acak.\nBerapakah peluang Rini mengambil angpao yang kosong?",o:["1/15","1/5","1/4","1/3","5/11"],a:2,e:"Berisi hadiah = 15 + 12 + 10 + 8 = 45.\nKosong = 60 − 45 = 15.\nPeluang = 15/60 = 1/4."},
{t:"pg",q:"Kotak undian kantin berisi 6 kertas Minuman Gratis, 4 kertas Makanan Gratis, dan 5 kertas kosong (total 15). Hanya kertas kosong yang dikembalikan ke kotak. Ani orang kelima yang mengambil.\nKertas apa saja yang mungkin sudah terambil oleh 4 orang sebelumnya sehingga peluang Ani memperoleh minuman atau makanan adalah 2/3?",o:["1 minuman gratis, 1 makanan gratis, dan 2 kertas kosong.","2 makanan gratis dan 2 minuman gratis.","2 minuman gratis dan 2 kertas kosong.","4 kertas kosong.","4 minuman gratis."],a:3,e:"Jika k kertas berhadiah sudah terambil (tidak kembali): (10 − k)/(15 − k) = 2/3 → 30 − 3k = 30 − 2k → k = 0.\nJadi keempat orang sebelumnya mengambil kertas kosong (dikembalikan)."}
];
const N=Q.length,DUR=90*60,$=s=>document.querySelector(s),app=$("#app");
let S={},T;
const E=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const TY={pg:"Pilihan Ganda",mc:"Pilihan Ganda Kompleks (pilih > 1)",kt:"Benar / Salah"};
function start(){
 app.innerHTML=`<div class="hero"><h1>📘 Try Out TKA Matematika</h1><p>SMA/MA/SMK · Tahun 2025 · ${N} soal · 90 menit</p></div>
 <div class="card" style="max-width:520px;margin:auto"><h2 style="margin-top:0">Data Peserta</h2>
 <label>Nama Siswa</label><input id="f1" placeholder="Nama lengkap">
 <label>Kelas</label><input id="f2" placeholder="Contoh: XII IPA 1">
 <label>Peserta Didik (No. Peserta / NISN)</label><input id="f3" placeholder="Nomor peserta didik">
 <label>Asal Sekolah</label><input id="f4" placeholder="Nama sekolah">
 <p id="er" style="color:var(--bad);min-height:1.2em"></p><button id="go" style="width:100%">Mulai Try Out →</button><button class="o" style="width:100%;margin-top:10px" onclick="hist()">📈 Riwayat & Progres</button></div>`;
 $("#go").onclick=()=>{const v=[1,2,3,4].map(i=>$("#f"+i).value.trim());if(v.some(x=>!x)){$("#er").textContent="Mohon lengkapi semua data.";return}
  S={name:v[0],cls:v[1],pid:v[2],school:v[3],i:0,ans:Array(N).fill(null),dbt:Array(N).fill(false),left:DUR};
  clearInterval(T);T=setInterval(tick,1000);test()}
}
const fmt=s=>[s/3600|0,(s%3600)/60|0,s%60].map(x=>String(x).padStart(2,"0")).join(":");
function tick(){S.left--;const t=$("#tm");if(t){t.textContent="⏱ "+fmt(S.left);t.classList.toggle("l",S.left<300)}if(S.left<=0)finish()}
function done(i){const a=S.ans[i],q=Q[i];return q.t=="pg"?a!==null:q.t=="mc"?a&&a.length>0:a&&a.every(x=>x!==null&&x!==undefined)}
function test(){
 const i=S.i,q=Q[i],a=S.ans[i];let o="";
 if(q.t=="kt"){o=`<table><tr><th>Pernyataan</th><th>Benar</th><th>Salah</th></tr>${q.o.map((x,k)=>`<tr><td>${E(x)}</td>${[true,false].map(b=>`<td><input type="radio" name="r${k}" style="width:20px;height:20px" ${a&&a[k]===b?"checked":""} onchange="setKt(${k},${b})"></td>`).join("")}</tr>`).join("")}</table>`}
 else o=q.o.map((x,k)=>`<div class="op ${q.t=="pg"?a===k:a&&a.includes(k)?"on":""}" onclick="pick(${k})"><b>${q.t=="pg"?"ABCDE"[k]:(a&&a.includes(k)?"☑":"☐")}</b><span>${E(x)}</span></div>`).join("");
 app.innerHTML=`<div class="top"><div><b>${E(S.name)}</b><br><small>${E(S.cls)} · ${E(S.school)}</small></div><div class="tm" id="tm">⏱ ${fmt(S.left)}</div></div>
 <div class="g2"><div class="card"><span class="tag">Soal ${i+1} dari ${N}</span> <span class="tag" style="background:#e0f2fe;color:#0369a1">${TY[q.t]}</span>${S.dbt[i]?' <span class="tag" style="background:#fef3c7;color:#92400e">Ragu-ragu</span>':""}
 <div class="q">${E(q.q)}</div>${o}
 <div class="nav"><button class="g" ${i?"":"disabled"} onclick="go(${i-1})">← Sebelumnya</button><button class="y" onclick="doubt()">${S.dbt[i]?"✓ Batal Ragu":"? Ragu-ragu"}</button>
 ${i<N-1?`<button onclick="go(${i+1})">Selanjutnya →</button>`:`<button class="s" onclick="ask()">Selesai ✔</button>`}</div></div>
 <div class="card"><b>Navigasi Soal</b><div class="grid" style="margin-top:10px">${Q.map((_,k)=>`<div class="n ${S.dbt[k]?"r":done(k)?"a":""} ${k==i?"c":""}" onclick="go(${k})">${k+1}</div>`).join("")}</div>
 <div class="lg"><span><i style="background:var(--ok)"></i>Sudah dijawab (${Q.filter((_,k)=>done(k)&&!S.dbt[k]).length})</span><span><i style="background:var(--rg)"></i>Ragu-ragu (${S.dbt.filter(Boolean).length})</span><span><i style="background:var(--no)"></i>Belum dijawab (${Q.filter((_,k)=>!done(k)&&!S.dbt[k]).length})</span></div>
 <button class="s" style="width:100%;margin-top:14px" onclick="ask()">Selesai & Kumpulkan</button></div></div>`;
}
const go=i=>{S.i=i;test();scrollTo(0,0)};
function pick(k){const q=Q[S.i];if(q.t=="pg")S.ans[S.i]=k;else{let a=S.ans[S.i]||[];S.ans[S.i]=a.includes(k)?a.filter(x=>x!=k):[...a,k]}test()}
function setKt(k,b){const a=S.ans[S.i]||Array(Q[S.i].o.length).fill(null);a[k]=b;S.ans[S.i]=a;test()}
function doubt(){S.dbt[S.i]=!S.dbt[S.i];test()}
function ask(){const u=Q.filter((_,k)=>!done(k)).length,d=S.dbt.filter(Boolean).length;
 if(confirm(`Kumpulkan jawaban?\nBelum dijawab: ${u} soal\nRagu-ragu: ${d} soal`))finish()}
function ok(i){const q=Q[i],a=S.ans[i];if(!done(i))return false;
 return q.t=="pg"?a===q.a:q.t=="mc"?[...a].sort().join()==q.a.join():q.a.every((x,k)=>a[k]===x)}
function ansTxt(q,a,c){if(a===null||a===undefined||(Array.isArray(a)&&!a.length))return"— tidak dijawab —";
 if(q.t=="pg")return "ABCDE"[a]+". "+q.o[a];if(q.t=="mc")return a.map(k=>q.o[k]).join("; ");
 return q.o.map((x,k)=>(k+1)+") "+(a[k]===null||a[k]===undefined?"–":a[k]?"Benar":"Salah")).join("  ")}
function finish(){clearInterval(T);const r=Q.map((_,i)=>ok(i)),b=r.filter(Boolean).length,sc=Math.round(b/N*100),used=DUR-Math.max(S.left,0);
 const rec=save(r,b,sc,used);const em=sc>=80?"🏆 Luar biasa!":sc>=60?"👍 Bagus, terus berlatih!":"💪 Tetap semangat, pelajari pembahasan di bawah.";
 app.innerHTML=`<div class="hero" style="text-align:center"><p>Nilai Akhir</p><div class="sc">${sc}</div><p style="margin-top:8px">${em}</p></div>
 <div class="card"><table><tr><td><b>Nama</b></td><td style="text-align:left">${E(S.name)}</td></tr><tr><td><b>Kelas</b></td><td style="text-align:left">${E(S.cls)}</td></tr><tr><td><b>Peserta Didik</b></td><td style="text-align:left">${E(S.pid)}</td></tr><tr><td><b>Asal Sekolah</b></td><td style="text-align:left">${E(S.school)}</td></tr>
 <tr><td><b>Hasil</b></td><td style="text-align:left">Benar ${b} · Salah ${Q.filter((_,i)=>done(i)&&!r[i]).length} · Kosong ${Q.filter((_,i)=>!done(i)).length} · Waktu ${fmt(used)}</td></tr></table>
 <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(44px,1fr));margin-top:14px">${r.map((x,i)=>`<a href="#s${i}" style="text-decoration:none"><div class="n" style="background:${x?"var(--ok)":"var(--bad)"}">${i+1}</div></a>`).join("")}</div>
 <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button onclick="start()">🔄 Ulangi Try Out</button><button class="s" onclick="cert()">🎓 Sertifikat</button><button class="g" onclick="hist()">📈 Riwayat & Progres</button><button class="o" onclick="print()">🖨 Cetak</button></div></div>${detail(rec)}
 <h2>Pembahasan Soal</h2><div class="card">${Q.map((q,i)=>`<div class="rv" id="s${i}"><span class="tag">Soal ${i+1}</span> <span class="st" style="color:${r[i]?"var(--ok)":"var(--bad)"}">${r[i]?"✔ Benar":done(i)?"✘ Salah":"✘ Tidak dijawab"}</span>
 <div class="q">${E(q.q)}</div><div><b>Jawabanmu:</b> ${E(ansTxt(q,S.ans[i]))}</div><div><b>Kunci:</b> ${E(ansTxt(q,q.a))}</div><div class="ex"><b>Pembahasan:</b>\n${E(q.e)}</div></div>`).join("")}</div>`;
 scrollTo(0,0)}

const EL=[["Bilangan",0,3],["Aljabar",3,9],["Geometri & Pengukuran",9,20],["Data & Peluang",20,25]];
const LS=()=>{try{return JSON.parse(localStorage.getItem("tka_hist")||"[]")}catch(e){return[]}};
const fd=d=>new Date(d).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
function save(r,b,sc,used){const el=EL.map(([n,a,z])=>[n,r.slice(a,z).filter(Boolean).length,z-a]);
 const rec={name:S.name,cls:S.cls,pid:S.pid,school:S.school,d:new Date().toISOString(),sc,b,s:Q.filter((_,i)=>done(i)&&!r[i]).length,k:Q.filter((_,i)=>!done(i)).length,used,el};
 const h=LS();h.push(rec);try{localStorage.setItem("tka_hist",JSON.stringify(h))}catch(e){}
 rec.n=h.filter(x=>x.pid==rec.pid&&x.name==rec.name).length;S.rec=rec;S.h=h;return rec}
const own=r=>S.h.filter(x=>x.pid==r.pid&&x.name==r.name);
function bars(r){return r.el.map(([n,b,t])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><span>${n}</span><b>${b}/${t} (${Math.round(b/t*100)}%)</b></div><div style="height:10px;background:var(--no);border-radius:9px"><div style="width:${b/t*100}%;height:100%;border-radius:9px;background:linear-gradient(90deg,#6d28d9,#0ea5e9)"></div></div></div>`).join("")}
function chart(l){const n=l.length,x=i=>40+(n<2?260:i*480/(n-1)),y=v=>160-v*1.4;
 return `<svg viewBox="0 0 560 190" style="width:100%;max-width:620px">${[0,25,50,75,100].map(v=>`<line x1="40" x2="540" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--bd)"/><text x="8" y="${y(v)+3}" font-size="10" style="fill:var(--mu)">${v}</text>`).join("")}<polyline fill="none" stroke="#6d28d9" stroke-width="3" points="${l.map((r,i)=>x(i)+","+y(r.sc)).join(" ")}"/>${l.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.sc)}" r="5" fill="#0ea5e9"/><text x="${x(i)}" y="${y(r.sc)-10}" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--tx)">${r.sc}</text><text x="${x(i)}" y="180" text-anchor="middle" font-size="10" style="fill:var(--mu)">TO ${i+1}</text>`).join("")}</svg>`}
function detail(r){const m=own(r),pv=m[m.length-2],d=pv?r.sc-pv.sc:0;
 return `<h2>Rincian per Elemen & Progres</h2><div class="card"><b>Rincian per Elemen</b>${bars(r)}<p>${pv?`Dibanding Try Out ke-${m.length-1}: <b style="color:${d>=0?"var(--ok)":"var(--bad)"}">${d>=0?"▲ +":"▼ "}${d}</b> poin`:"Ini try out pertamamu. Ulangi try out untuk melihat progresmu."}</p><b>Grafik Progres</b>${chart(m)}</div>`}
const keep=()=>{S.html=document.querySelector(".sc")?app.innerHTML:null};
const back=()=>{if(S.html){app.innerHTML=S.html;scrollTo(0,0)}else start()};
function hist(){keep();const h=LS(),g={};h.forEach(r=>(g[r.name+"|"+r.pid]=g[r.name+"|"+r.pid]||[]).push(r));
 app.innerHTML=`<div class="hero"><h1>📈 Riwayat & Progres Try Out</h1><p>Tersimpan di perangkat ini</p></div>`+(h.length?Object.values(g).map(l=>`<div class="card" style="margin-bottom:14px"><h3 style="margin-top:0">${E(l[0].name)} · ${E(l[0].cls)} · ${E(l[0].school)}</h3>${chart(l)}<table><tr><th>TO</th><th>Tanggal</th><th>Nilai</th><th>B/S/K</th></tr>${l.map((r,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${fd(r.d)}</td><td><b>${r.sc}</b></td><td>${r.b}/${r.s}/${r.k}</td></tr>`).join("")}</table></div>`).join(""):`<div class="card">Belum ada riwayat try out.</div>`)+`<div class="np nav" style="justify-content:flex-start"><button onclick="back()">← Kembali</button><button class="o" onclick="print()">🖨 Cetak</button>${h.length?'<button class="y" onclick="clr()">Hapus Riwayat</button>':""}</div>`;scrollTo(0,0)}
function clr(){if(confirm("Hapus semua riwayat try out?")){try{localStorage.removeItem("tka_hist")}catch(e){}hist()}}
function cert(){keep();const r=S.rec,m=own(r),p=r.sc>=85?"Sangat Baik":r.sc>=70?"Baik":r.sc>=55?"Cukup":"Perlu Ditingkatkan";
 app.innerHTML=`<div class="ct"><div style="font-size:2.4rem">🎓</div><div style="letter-spacing:3px;font-weight:700;color:#b8860b">SERTIFIKAT HASIL TRY OUT</div><h1 style="margin:6px 0">TKA Matematika SMA/MA/SMK 2025</h1><p>Diberikan kepada</p><h2 style="font-size:2rem;margin:4px 0;color:#6d28d9">${E(r.name)}</h2><p>Kelas ${E(r.cls)} · ${E(r.school)}<br>No. Peserta Didik: ${E(r.pid)}</p><p>telah menyelesaikan <b>Try Out ke-${r.n}</b> pada ${fd(r.d)} dengan nilai akhir</p><div style="font-size:3.4rem;font-weight:800;color:#6d28d9;line-height:1">${r.sc}</div><b>Predikat: ${p}</b><p>Benar ${r.b} · Salah ${r.s} · Kosong ${r.k} · Waktu ${fmt(r.used)}</p><div style="text-align:left;max-width:520px;margin:12px auto"><b>Rincian per Elemen</b>${bars(r)}</div><div><b>Progres Try Out</b><br>${chart(m)}</div><p style="font-size:.85rem">Dicetak ${fd(new Date())}</p></div><div class="np nav" style="justify-content:center"><button class="s" onclick="print()">🖨 Cetak / Simpan PDF</button><button onclick="back()">← Kembali ke Hasil</button></div>`;scrollTo(0,0)}
start();
</script></body></html>
